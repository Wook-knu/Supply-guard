# SupplyGuard 원커맨드 실행 (DB + 백엔드 + 프론트).
# 사용:  1) .env.example → .env 복사 후 값 채우기
#        2) docker compose up --build
#        3) DB 시딩(최초 1회): docs/deployment.md 의 "DB 시딩" 참고
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: supplyguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplyguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: supplyguard
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # 기본값을 두면 하드코딩된 키로 JWT가 서명돼 토큰 위조가 가능해진다.
      # 값이 없으면 컨테이너를 띄우지 않는다. (.env.example 참고)
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set - see .env.example}
      ALLOW_STUB_LOGIN: ${ALLOW_STUB_LOGIN:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
